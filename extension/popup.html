<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
    }
    .header {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title { font-size: 15px; font-weight: 600; }
    .card {
      margin: 12px;
      padding: 14px;
      border-radius: 10px;
    }
    .safe      { background: #E1F5EE; }
    .suspicious{ background: #FAEEDA; }
    .dangerous { background: #FCEBEB; }
    .loading   { background: #F1EFE8; }
    .status-icon { font-size: 32px; margin-bottom: 8px; }
    .status-label { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .status-label.safe       { color: #085041; }
    .status-label.suspicious { color: #633806; }
    .status-label.dangerous  { color: #791F1F; }
    .status-label.loading    { color: #444; }
    .confidence {
      font-size: 12px;
      color: #555;
      margin-top: 4px;
    }
    .url-box {
      margin: 0 12px 12px;
      padding: 8px 10px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 11px;
      color: #555;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size:20px">🛡️</span>
    <span class="header-title">Phishing Detector</span>
  </div>

  <div class="card loading" id="card">
    <div class="status-icon" id="icon">⏳</div>
    <div class="status-label loading" id="label">Analyzing...</div>
    <div class="confidence" id="confidence"></div>
  </div>

  <div class="url-box" id="url-box">Loading...</div>

  <script src="popup.js"></script>
</body>
</html>
